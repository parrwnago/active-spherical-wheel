[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "active-spherical-wheel"
version = "0.3.1"
description = "Provisional active spherical wheel balance and tracking simulation"
requires-python = ">=3.10"
dependencies = ["mujoco==3.16.0", "numpy>=1.24,<2", "scipy>=1.10", "matplotlib>=3.7", "PyYAML>=6", "imageio>=2.30", "imageio-ffmpeg>=0.5"]

[project.optional-dependencies]
mpc = ["osqp>=1.0,<2"]

[project.scripts]
spherical-wheel = "spherical_wheel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
